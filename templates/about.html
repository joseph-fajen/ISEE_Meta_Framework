<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - ISEE Meta Framework</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
        }

        .header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            flex-direction: column;
            color: white;
        }

        .logo-main {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -1px;
            margin-bottom: -4px;
        }

        .logo-tagline {
            font-size: 0.9rem;
            font-weight: 400;
            opacity: 0.9;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.95);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: white;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 0 40px 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .content-wrapper {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            padding: 45px 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 750px;
        }

        .content h1 {
            font-size: 1.8rem;
            font-weight: 400;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Times New Roman', serif;
        }

        .content h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #34495e;
            margin: 25px 0 12px 0;
            border-bottom: 1px solid #667eea;
            padding-bottom: 6px;
            font-family: 'Times New Roman', serif;
        }

        .content h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #34495e;
            margin: 20px 0 10px 0;
            font-family: 'Times New Roman', serif;
        }

        .content p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #444;
            margin-bottom: 14px;
            text-align: justify;
            font-family: 'Times New Roman', serif;
        }

        .content ul {
            margin: 14px 0;
            padding-left: 25px;
        }

        .content li {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #444;
            margin-bottom: 8px;
            font-family: 'Times New Roman', serif;
        }

        .content strong {
            color: #2c3e50;
            font-weight: 600;
        }

        .content em {
            color: #667eea;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .header {
                padding: 20px;
                flex-direction: column;
                gap: 20px;
            }

            .main-container {
                padding: 0 20px 40px;
            }

            .content-wrapper {
                padding: 40px 30px;
            }

            .content h1 {
                font-size: 1.6rem;
            }

            .content h2 {
                font-size: 1.1rem;
            }

            .content p, .content li {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-main">ISEE</div>
            <div class="logo-tagline">Multi-Perspective Intelligence Amplifier</div>
        </div>
        <nav class="nav-links">
            <a href="/isee-ui">Home</a>
            <a href="#">Documentation</a>
            <a href="#">Examples</a>
            <a href="/about">About</a>
        </nav>
    </header>

    <div class="main-container">
        <div class="content-wrapper">
            <div class="content">
                {{ content|safe }}
            </div>
        </div>
    </div>
</body>
</html>
